name: Cattle Vision QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Prevent repeating wrapper regressions
        shell: python
        run: |
          import pathlib, re, sys

          unbounded = {
              'ai-cattle.js': 'setInterval(wrap,',
              'guardian-statuses.js': 'setInterval(install,',
              'guardian-vet.js': 'setInterval(wrap,',
              'guardian-litter-vet.js': 'setInterval(wrap,',
              'guardian-litter-refresh.js': 'setInterval(install,',
          }
          failures = []
          for filename, pattern in unbounded.items():
              if pattern in pathlib.Path(filename).read_text(encoding='utf-8'):
                  failures.append(f'{filename} still polls its UI wrapper')

          cloud_wrappers = (
              'ai-cloud.js',
              'guardian-dog-cloud.js',
              'guardian-vet-cloud.js',
              'guardian-litter-vet-cloud.js',
              'equine-cloud.js',
          )
          for filename in cloud_wrappers:
              text = pathlib.Path(filename).read_text(encoding='utf-8')
              for required in ('Object.assign(w,s)', 'Object.assign(w,p)', 'clearInterval(timer)'):
                  if required not in text:
                      failures.append(f'{filename} is missing {required}')

          bulk = pathlib.Path('bulk-stability.js').read_text(encoding='utf-8')
          if bulk.count('Object.assign(guarded,fn)') < 3 or 'clearInterval(guardTimer)' not in bulk:
              failures.append('bulk-stability.js wrapper guards are not bounded and composable')

          no_tag = pathlib.Path('herd-no-tag.js').read_text(encoding='utf-8')
          if 'setInterval(update' in no_tag or 'MutationObserver' in no_tag or 'if(total.textContent!==totalText)' not in no_tag:
              failures.append('herd-no-tag.js can retrigger its own total-count observer')

          cloud_sync = pathlib.Path('cloud-sync.js').read_text(encoding='utf-8')
          if "localStorage.getItem(DIRTY_KEY)!=='1'" not in cloud_sync or "visibilitychange" in cloud_sync:
              failures.append('cloud-sync.js can start a full backup just because the app opened')

          index_html = pathlib.Path('index.html').read_text(encoding='utf-8')
          if '__cvSafeMode' not in index_html or "get('safe')==='1'" not in index_html:
              failures.append('index.html is missing the lightweight iPhone safe-mode gate')

          static_scripts = re.findall(r'<script[^>]+src="([^"?]+\.js)(?:\?[^"#]*)?"', index_html)
          required_core = {
              'app-v2.js', 'pastures.js', 'bulk-sort.js', 'farm-menu.js',
              'pasture-costs.js', 'ranch-economics.js', 'cloud-on-demand.js',
          }
          missing_core = sorted(required_core - set(static_scripts))
          if missing_core:
              failures.append('stable core scripts are missing: ' + ', '.join(missing_core))
          if 'cloud-loader.js' in static_scripts or 'data-cloud-loader' in index_html:
              failures.append('cloud must load only after the user opens Cloud')
          for marker in ("data-herd-view=\"all\"", "data-herd-view=\"young\"",
                         "data-herd-view=\"females\"", "data-herd-view=\"sires\""):
              if marker not in index_html:
                  failures.append(f'herd summary filter is missing {marker}')

          app = pathlib.Path('app-v2.js').read_text(encoding='utf-8')
          for required in ('function setHerdView(', 'function inHerdView(',
                           'render.__cvHardened=true', "pastureCostEvents",
                           "mileageEvents"):
              if required not in app:
                  failures.append(f'app-v2.js is missing {required}')

          local_ui = (
              'guardian-grass.js', 'farm-menu.js', 'medication-costs.js',
              'ai-cattle.js', 'guardian-dogs.js', 'guardian-statuses.js',
              'guardian-vet.js', 'guardian-litter-vet.js',
              'guardian-litter-refresh.js', 'guardian-vet-costs.js',
              'medication-treatment-costs.js', 'ranch-economics.js',
              'pasture-costs.js', 'hay-market-preset.js', 'mileage-costs.js',
              'pasture-sessions.js', 'pasture-library-later.js',
              'equine-records.js', 'qa-hardening.js', 'herd-no-tag.js',
          )
          for filename in local_ui:
              if 'setInterval(' in pathlib.Path(filename).read_text(encoding='utf-8'):
                  failures.append(f'{filename} must not run a permanent UI polling loop')

          grass = pathlib.Path('guardian-grass.js').read_text(encoding='utf-8')
          menu = pathlib.Path('farm-menu.js').read_text(encoding='utf-8')
          if 'Object.assign(wrappedRender,origRender)' not in grass:
              failures.append('guardian-grass.js does not preserve hardened render metadata')
          if 'Object.assign(wrappedRender,originalRender)' not in menu:
              failures.append('farm-menu.js does not preserve hardened render metadata')

          on_demand = pathlib.Path('cloud-on-demand.js').read_text(encoding='utf-8')
          if '__cvCloudManualMode=true' not in on_demand or "cloud-loader.js?v=18" not in on_demand:
              failures.append('cloud-on-demand.js is not enforcing manual cloud startup')

          pasture_costs = pathlib.Path('pasture-costs.js').read_text(encoding='utf-8')
          for required in ('Grain / Concentrate', 'Feed Cost / Cow Now',
                           'feed/hay/grain', 'Add Feed / View Costs'):
              if required not in pasture_costs:
                  failures.append(f'pasture-costs.js is missing {required}')

          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('UI wrappers are one-time; cloud wrapper retries are bounded and composable.')

      - name: Check local and dynamically referenced assets
        shell: python
        run: |
          import collections, pathlib, re, sys
          root = pathlib.Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')

          def local_path(ref):
              ref = ref.strip()
              if not ref or ref.startswith(('http://','https://','data:','blob:','#')):
                  return None
              return ref.split('?',1)[0].split('#',1)[0]

          refs = []
          refs += re.findall(r'(?:src|href)="([^"?#]+\.(?:js|css))(?:\?[^"#]*)?"', html)

          for js in root.glob('*.js'):
              text = js.read_text(encoding='utf-8')
              for ref in re.findall(r"['\"]([^'\"]+\.(?:js|css)(?:\?[^'\"]*)?)['\"]", text):
                  p = local_path(ref)
                  if p:
                      refs.append(p)

          for css in root.glob('*.css'):
              text = css.read_text(encoding='utf-8')
              for ref in re.findall(r'url\(["\']?([^"\')]+)["\']?\)', text):
                  p = local_path(ref)
                  if p:
                      refs.append(p)

          missing = sorted({ref for ref in refs if not (root / ref).is_file()})
          if missing:
              print('Missing local files referenced by the app:')
              for ref in missing:
                  print(' -', ref)
              sys.exit(1)
          print(f'Checked {len(refs)} local/dynamic asset references; all exist.')

          static_refs = re.findall(r'(?:src|href)="([^"?#]+\.(?:js|css))(?:\?[^"#]*)?"', html)
          dupes = sorted(k for k,v in collections.Counter(static_refs).items() if v > 1)
          if dupes:
              print('Duplicate static script/style references:', ', '.join(dupes))
              sys.exit(1)
          print('No duplicate static script/style references found.')

      - name: Check inline handler targets exist
        shell: python
        run: |
          import pathlib, re, sys
          root = pathlib.Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          js = '\n'.join(p.read_text(encoding='utf-8') for p in root.glob('*.js'))
          defined = set(re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', js))
          defined.update(re.findall(r'\bwindow\.([A-Za-z_$][\w$]*)\s*=', js))
          handlers = re.findall(r'\bon(?:click|change|input)="([^"]+)"', html)
          called = set()
          for handler in handlers:
              m = re.match(r'\s*([A-Za-z_$][\w$]*)\s*\(', handler)
              if m:
                  called.add(m.group(1))
          missing = sorted(called - defined)
          if missing:
              print('Inline handlers reference missing functions:', ', '.join(missing))
              sys.exit(1)
          print(f'Checked {len(called)} direct inline handler functions; all are defined.')

      - name: Check duplicate static HTML ids
        shell: python
        run: |
          import collections, pathlib, re, sys
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          ids = re.findall(r'\bid="([^"]+)"', html)
          dupes = sorted(k for k, v in collections.Counter(ids).items() if v > 1)
          if dupes:
              print('Duplicate static HTML ids:', ', '.join(dupes))
              sys.exit(1)
          print(f'Checked {len(ids)} static HTML ids; no duplicates found.')

      - name: Verify ranch background asset
        shell: bash
        run: |
          set -euo pipefail
          test -s background.jpg
          file background.jpg | grep -qi 'JPEG image data'
          echo "background.jpg is present and recognized as JPEG data."
