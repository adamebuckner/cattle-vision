name: Install sunset pasture background
on:
  push:
    paths:
      - background-release.trigger
permissions:
  contents: write
jobs:
  install-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pasture photo
        run: |
          set -e
          if [ ! -f background-live.b64 ]; then
            echo "background-live.b64 is missing"
            exit 1
          fi

          base64 --decode background-live.b64 > background.jpg
          file background.jpg | grep -q 'JPEG image data'

          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('app-v2.css')
          s = css.read_text()
          s = re.sub(r"url\('background(?:\.svg|\.jpg)[^']*'\)", "url('background.jpg?v=sunset-final-20260901')", s, count=1)
          css.write_text(s)

          index = Path('index.html')
          h = index.read_text()
          h = re.sub(r'app-v2\.css\?v=[^\"\']+', 'app-v2.css?v=visual5', h, count=1)
          h = re.sub(r'Cattle Vision v[0-9.]+ · Your records\. Your operation\.', 'Cattle Vision v3.7 · Your records. Your operation.', h)
          index.write_text(h)
          PY

          rm -f background-live.b64 background-release.trigger
      - name: Commit sunset pasture background
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use ranch sunset photo as app background"
          git push
