name: Release v3.4 loader bump
on:
  push:
    paths:
      - release-v31.trigger
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump live loader version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('testing-notice.js?v=17','testing-notice.js?v=18')
          s=s.replace('Cattle Vision v3.3 · Your records. Your operation.','Cattle Vision v3.4 · Your records. Your operation.')
          p.write_text(s)
          PY
      - name: Commit live cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh v3.4 loader cache"
          git push