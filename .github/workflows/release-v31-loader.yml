name: Release v3.7 sunset background
on:
  push:
    paths:
      - release-v31.trigger
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force new sunset background asset and stylesheet cache
        run: |
          python - <<'PY'
          from pathlib import Path

          css=Path('app-v2.css')
          s=css.read_text()
          s=s.replace("background:#36583d", "background:#26342a")
          s=s.replace("background.svg?v=professional1", "background.svg?v=sunset-pasture-20260901")
          css.write_text(s)

          p=Path('index.html')
          h=p.read_text()
          h=h.replace('app-v2.css?v=visual2','app-v2.css?v=sunset-pasture-20260901')
          h=h.replace('Cattle Vision v3.6 · Your records. Your operation.','Cattle Vision v3.7 · Your records. Your operation.')
          p.write_text(h)
          PY
      - name: Commit sunset background release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v2.css index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Force sunset pasture background in v3.7"
          git push